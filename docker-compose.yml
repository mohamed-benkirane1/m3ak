name: m3ak

services:
  postgres:
    image: postgres:16-alpine
    container_name: m3ak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m3ak_dev}
      POSTGRES_USER: ${POSTGRES_USER:-m3ak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3ak-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m3ak} -d ${POSTGRES_DB:-m3ak_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - m3ak-network

  redis:
    image: redis:7-alpine
    container_name: m3ak-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - m3ak-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: m3ak-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://m3ak:m3ak-local-dev-only@postgres:5432/m3ak_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS:-}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - m3ak-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: m3ak-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://m3ak:m3ak-local-dev-only@postgres:5432/m3ak_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - m3ak-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: m3ak-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - m3ak-network

volumes:
  postgres_data:
    name: m3ak_postgres_data
  redis_data:
    name: m3ak_redis_data

networks:
  m3ak-network:
    name: m3ak-network
    driver: bridge
